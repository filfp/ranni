name: Publish to npm

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: filfp/relic/.github/actions/setup-bun@648eae1e5891a9f3221be18feeff341c6fa99531 # relic main, 2026-11-12

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC): no token. npm checks this workflow's filename.
      - name: Publish to npm
        run: npm publish --provenance --access public
