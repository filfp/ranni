name: Publish to npm

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: filfp/relic/.github/actions/setup-bun@f0fc60912a1fc9a565684513b6824fcbab10b455 # relic main, 2026-11-12

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC): no token. npm checks this workflow's filename.
      # A rerun skips a version npm already has, so the GitHub Packages step can still run.
      - name: Publish to npm
        run: |
          if npm view "ranni-cli@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "Already on npm."
          else
            npm publish --provenance --access public
          fi

      # GitHub Packages only takes scoped names: @filfp/ranni-cli.
      - name: Publish to GitHub Packages
        uses: filfp/relic/.github/actions/github-packages@f0fc60912a1fc9a565684513b6824fcbab10b455 # relic main, 2026-11-12
