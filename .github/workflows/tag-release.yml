name: Tag release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    permissions:
      contents: write
      actions: write
    # Shared with Relic, pinned to a commit of filfp/relic.
    uses: filfp/relic/.github/workflows/release-tag.yml@648eae1e5891a9f3221be18feeff341c6fa99531 # relic main, 2026-11-12
    with:
      check: test "$(node -p "require('./package.json').version")" = "$VERSION"
      targets: npm:publish-npm.yml
